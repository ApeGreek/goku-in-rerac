[package]
name = "rc-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "randcrw-extract: identifies the user's Ratchet & Clank disc image and extracts the Tier 0 archive (docs/plan/launcher_contract.md)."

# Dependency-free by decision (docs/plan/decisions.md): only the workspace's own format readers.
[dependencies]
rc-formats = { path = "../rc-formats" }

[lib]
name = "rc_extract"
path = "src/lib.rs"

[[bin]]
name = "randcrw-extract"
path = "src/main.rs"

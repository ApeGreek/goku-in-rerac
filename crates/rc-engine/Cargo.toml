[package]
name = "rc-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Faithful reimplementation runtime for Ratchet & Clank (PS2) on Bevy."

# The runtime executable is `randcrw` (launcher contract); the crate stays `rc-engine` (`cargo dev`, `-p rc-engine`).
[[bin]]
name = "randcrw"
path = "src/main.rs"

[features]
# `cargo run -p rc-engine --features dev` links Bevy as a dynamic library: seconds, not minutes, per rebuild.
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = "0.19"
rc-formats = { path = "../rc-formats" }
rc-game = { path = "../rc-game" }
# Decompressed lumps through the Tier 1 engine cache (once per process).
rc-data = { path = "../rc-data" }
anyhow.workspace = true

# CI: compile checks, lints and the tests that need no game data (docs/workflows/release.md).
# The runner has no disc and no extracted/ folder, and must never get one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check, clippy, tests without game data
    runs-on: macos-14 # Apple Silicon, the tested platform
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rustup, stable)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo check-all
        run: cargo check-all

      - name: cargo clippy-all
        run: cargo clippy-all

      # The whole suite as on a machine without extracted/: the data root is an empty folder, so the tests that need
      # game data take their early return, and xtask lists each of them as SKIPPED (log, warning annotation and step
      # summary). They are never silent passes. No hero digest (it needs game data). Runner: cargo test (no nextest here).
      - name: Tests without game data
        run: cargo xtask test-full --no-game-data
